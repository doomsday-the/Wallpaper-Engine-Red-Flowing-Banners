<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Futuristic Desktop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- The Visual Layer: WebGL Canvas -->
    <canvas id="glcanvas"></canvas>

    <!-- The Interface Layer: Will hold UI in future phases -->
    <div id="ui-layer">
        <div id="status-panel" class="ui-panel">
            <div id="clock-container">
                <div id="time-display">00:00</div>
                <div id="date-display">System Date</div>
            </div>
            <div id="system-status">
                <span class="status-dot"></span>
                SYSTEM ONLINE
            </div>
        </div>
    </div>

    <!-- Configuration Defaults -->
    <script src="config/settings.js"></script>

    <!-- Animation System -->
    <script src="animation/gl-context.js"></script>
    <script src="animation/shaders.js"></script>
    <script src="animation/renderer.js"></script>

    <!-- Main Entry Point -->
    <script src="ui/ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
